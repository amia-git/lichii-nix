name: Build release and publish to Cachix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build x86_64-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check Cachix credentials
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo '::error::Set the CACHIX_AUTH_TOKEN repository secret to a token with write access to the amia-git Cachix cache.'
            exit 1
          fi

      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            cores = 2
            max-jobs = 1

      - name: Configure Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: amia-git
          # Publish explicitly after the build and smoke test succeed. This also
          # uploads the closure when the result was substituted rather than built.
          skipPush: true

      - name: Check flake
        run: nix flake check --no-build

      - name: Build Lichii
        run: nix build .#packages.x86_64-linux.lichii --print-build-logs

      - name: Smoke test CLI
        run: |
          state=$(mktemp -d)
          trap 'rm -rf "$state"' EXIT
          mkdir -p "$state/data" "$state/cache" "$state/config"
          XDG_DATA_HOME="$state/data" \
          XDG_CACHE_HOME="$state/cache" \
          XDG_CONFIG_HOME="$state/config" \
            timeout 30 ./result/bin/eden-cli --version

      - name: Publish to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: cachix push amia-git ./result
